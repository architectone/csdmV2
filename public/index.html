<!DOCTYPE html><html><head><meta charset="UTF-8"><title>CSDM Graph Linker - Phase 3.7</title><script src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"></script><link rel="stylesheet" href="/styles.css"></head><body><div id="header"><h2>CSDM Component Relational Linker</h2><div id="current-model-name" class="current-model-name"></div><button id="about-btn" class="about-btn" onclick="openAboutDialog()">About</button></div><div id="main-container"><div id="network-pane"><div id="network-canvas"></div><div id="zoom-controls" class="zoom-controls"><button id="zoom-in-btn" type="button" title="Zoom in" onclick="zoomNetwork(1.25)">+</button><button id="zoom-out-btn" type="button" title="Zoom out" onclick="zoomNetwork(0.8)">&minus;</button></div><div id="empty-state" class="empty-state hidden"><h3>Start here</h3><p class="es-sub">Three ways in, easiest first. Each one only lets you build valid CSDM relationships, so you can't model something that couldn't exist.</p><div class="es-cards"><button type="button" class="es-card" onclick="startHereGo('interview')"><strong>Describe your environment &rarr;</strong><span>Say how your systems actually work, in your own words. Words that are ambiguous in CSDM &mdash; &ldquo;service&rdquo;, &ldquo;cluster&rdquo;, &ldquo;instance&rdquo; &mdash; get asked about rather than guessed at. No CSDM vocabulary needed up front.</span></button><button type="button" class="es-card" onclick="startHereGo('example')"><strong>Open a finished model &rarr;</strong><span>Take a working model apart instead of building one. Fastest way to see the point: fail a shared component and watch the blast radius reach the business.</span></button><button type="button" class="es-card" onclick="startHereGo('guided')"><strong>Build it layer by layer &rarr;</strong><span>Walk the CSDM layers in order &mdash; capability, application, service, infrastructure &mdash; with a definition and an example at every step.</span></button></div><div class="es-foot"><button type="button" class="es-link" onclick="startHereGo('tour')">Or take the 60-second tour of the interface</button><button type="button" class="es-x" onclick="closeStartHere()">Close</button></div></div><div id="canvas-menu" class="context-menu hidden"><button data-dialog="dialog-guided">Guided CSDM Path</button><button data-dialog="dialog-topology">Infrastructure Topology Builder</button><button data-dialog="dialog-relationship">Validated Relationship Builder</button><button data-dialog="dialog-quality">Model Quality Advisor (Coach)</button><button data-dialog="dialog-explain">Explain This Model</button><button onclick="setViewMode('neighborhood')">Selected Node Neighborhood View</button><button onclick="clearLineageHighlight()">Clear Highlight</button><button onclick="clearViewFilter()">Clear View Filter</button><button onclick="resetLayout()">Reset Layout</button><button data-dialog="dialog-governance">Model Governance</button><button data-dialog="dialog-reset">Seed Model Reset</button><button id="canvas-menu-cancel" class="menu-cancel">Cancel</button></div><div id="node-menu" class="context-menu hidden"><div id="node-menu-title" class="node-menu-title"></div><button id="node-menu-details">Open Node Details</button><button id="node-menu-use-from">Use as Relationship From Node</button><button id="node-menu-use-topology">Use as Runtime/Topology Parent</button><button id="node-menu-neighborhood">Show Selected Node Neighborhood</button><button id="node-menu-lineage-vertical">Highlight Vertical Lineage (Up &amp; Down)</button><button id="node-menu-lineage-connected">Highlight Full Connected Chain</button><button id="node-menu-why">Why This Node Matters</button><button id="node-menu-impact">Impact Analysis (What if this fails?)</button><button id="node-menu-simulate">Simulate Failure (cascade)</button><button id="node-menu-incident" onclick="hideMenus();startIncidentReplay(selectedNodeId)">Incident Replay (2am page)</button><button id="node-menu-add-environmen
